# Deploy only inventory (:3003). From repo root:
#   docker compose -f apps/inventory/docker-compose.yml up --build

name: console-inventory

services:
  inventory:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_NAME: inventory
        APP_PORT: 3003
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      SESSION_MODE: ${SESSION_MODE:-fixture}
      SESSION_FIXTURE_USER: ${SESSION_FIXTURE_USER:-admin}
