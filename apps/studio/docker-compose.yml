# Deploy only studio (:3006). From repo root:
#   docker compose -f apps/studio/docker-compose.yml up --build

name: console-studio

services:
  studio:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        APP_NAME: studio
        APP_PORT: 3006
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      SESSION_MODE: ${SESSION_MODE:-fixture}
      SESSION_FIXTURE_USER: ${SESSION_FIXTURE_USER:-admin}
