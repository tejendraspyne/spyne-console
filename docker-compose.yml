# Deploy all apps as independent containers. From repo root:
#   docker compose up --build -d
#
# Each service builds its own apps/<app>/Dockerfile.production (Next standalone).
# Ports: main :3000, console :3001, login :3002, inventory :3003,
#        admin-tools :3004, vini :3005, studio :3006, docs :3007

name: console

x-app-env: &app-env
  NODE_ENV: production
  SESSION_MODE: ${SESSION_MODE:-fixture}
  SESSION_FIXTURE_USER: ${SESSION_FIXTURE_USER:-admin}

services:
  main:
    build:
      context: .
      dockerfile: apps/main/Dockerfile.production
    ports:
      - "3000:3000"
    environment:
      <<: *app-env

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile.production
    ports:
      - "3001:3001"
    environment:
      <<: *app-env

  login:
    build:
      context: .
      dockerfile: apps/login/Dockerfile.production
    ports:
      - "3002:3002"
    environment:
      <<: *app-env

  inventory:
    build:
      context: .
      dockerfile: apps/inventory/Dockerfile.production
    ports:
      - "3003:3003"
    environment:
      <<: *app-env

  admin-tools:
    build:
      context: .
      dockerfile: apps/admin-tools/Dockerfile.production
    ports:
      - "3004:3004"
    environment:
      <<: *app-env

  vini:
    build:
      context: .
      dockerfile: apps/vini/Dockerfile.production
    ports:
      - "3005:3005"
    environment:
      <<: *app-env

  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile.production
    ports:
      - "3006:3006"
    environment:
      <<: *app-env

  docs:
    build:
      context: .
      dockerfile: apps/docs/Dockerfile.production
    ports:
      - "3007:3007"
    environment:
      <<: *app-env
